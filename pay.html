<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الدفع الآمن | IronFuel</title>
  <link id="theme-css" rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/store.css">
  <script src="/js/boot.js"></script>
</head>
<body>
  <main class="container">
    <div class="auth panel" id="box" style="margin-top:56px">
      <div class="notice" style="background:rgba(255,193,46,.1);border-color:rgba(255,193,46,.45);color:#ffd77a">بوابة دفع تجريبية (Sandbox) — لا يتم خصم أي أموال حقيقية.</div>
      <h1>الدفع الآمن</h1>
      <p class="text-secondary">طلب رقم <b id="code" dir="ltr" style="color:var(--volt)"></b></p>
      <form id="f" class="stack" autocomplete="off">
        <input class="form-control" placeholder="رقم البطاقة (4242 4242 4242 4242)" inputmode="numeric" maxlength="19" dir="ltr">
        <div class="price-row"><input class="form-control" placeholder="MM/YY" maxlength="5" dir="ltr"><input class="form-control" placeholder="CVV" maxlength="4" inputmode="numeric" dir="ltr"></div>
        <button class="btn btn-primary btn-lg" type="submit" id="ok">ادفع الآن</button>
        <button class="btn btn-outline-secondary" type="button" id="fail">محاكاة فشل الدفع</button>
      </form>
    </div>
  </main>
  <script src="/js/pay.js"></script>
</body>
</html>
